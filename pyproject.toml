[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "actiongap"
version = "0.0.1"
description = "Check the trust chain of cross-repo reusable workflows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
actiongap = "actiongap.cli:main"

[tool.setuptools]
packages = ["actiongap"]
